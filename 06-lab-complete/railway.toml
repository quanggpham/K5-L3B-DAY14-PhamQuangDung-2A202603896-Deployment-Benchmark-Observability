# Railway — build bằng Dockerfile trong thư mục này.
# Biến môi trường (AGENT_API_KEY, REDIS_URL...) đặt trên dashboard / `railway variables`,
# không ghi ở đây. Railway cấp PORT, CMD trong Dockerfile đọc ${PORT}.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
