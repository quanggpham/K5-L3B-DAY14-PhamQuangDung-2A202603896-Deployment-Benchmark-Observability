# Render Blueprint — agent (Docker) + Redis-compatible Key Value.
# Secret không ghi giá trị: AGENT_API_KEY do Render sinh (generateValue), REDIS_URL lấy từ service.
services:
  - type: web
    name: day14-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
